[package]
name = "orbmc"
version.workspace = true
edition.workspace = true
description = "Minecraft launcher"
license = "GPL-3.0-only"
homepage = "https://github.com/Incoderr/OrbMC"

# Linux packages, built by packaging/linux/package.sh.
[package.metadata.deb]
maintainer = "Incoderr <https://github.com/Incoderr/OrbMC/issues>"
copyright = "OrbMC contributors"
license-file = ["../LICENSE", "0"]
section = "games"
priority = "optional"
# GPUI loads Vulkan at run time, so it is not found by `$auto`.
depends = "$auto, libvulkan1"
assets = [
    ["target/release/orbmc", "usr/bin/", "755"],
    ["../packaging/linux/orbmc.desktop", "usr/share/applications/", "644"],
    ["../assets/logo/orbmc.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/orbmc", dest = "/usr/bin/orbmc", mode = "755" },
    { source = "../packaging/linux/orbmc.desktop", dest = "/usr/share/applications/orbmc.desktop", mode = "644" },
    { source = "../assets/logo/orbmc.png", dest = "/usr/share/icons/hicolor/256x256/apps/orbmc.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
vulkan-loader = "*"

[features]
default = ["devtools"]
devtools = ["dep:gpui-devtools"]

[dependencies]
gpui-kit.workspace = true
futures.workspace = true
reqwest.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
thiserror.workspace = true
mc-launcher-core.workspace = true
uuid.workspace = true
sha1.workspace = true
tempfile.workspace = true
discord-rich-presence.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
gpui-devtools = { workspace = true, optional = true }
orbmc-core = { path = "../core" }
minisign-verify = "0.3.0"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
raw-window-handle = "0.6"
windows = { version = "0.61.3", features = ["Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
# Writing fixture mod jars (fabric.mod.json + icons) in tests.
zip = "2.4.2"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
