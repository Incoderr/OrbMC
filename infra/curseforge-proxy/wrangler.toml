name = "orbmc-curseforge"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The launcher talks to the workers.dev address; per-version preview URLs
# would be extra open copies of the proxy.
workers_dev = true
preview_urls = false

# The API key is a secret, never a var here:
#   npx wrangler secret put CURSEFORGE_API_KEY

# 120 requests per minute per IP: a catalog session makes a few dozen.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }
