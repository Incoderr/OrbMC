name: Build Windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA, branch, or tag to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # Release builds carry the Discord application, the update public key
      # and, when CurseForge is switched on, its API key. All are baked in at
      # compile time.
      - name: Build launcher
        env:
          ORBMC_DISCORD_APP_ID: ${{ vars.ORBMC_DISCORD_APP_ID }}
          ORBMC_UPDATE_PUBLIC_KEY: ${{ vars.ORBMC_UPDATE_PUBLIC_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: cargo build --release --package orbmc --no-default-features --target x86_64-pc-windows-msvc

      - name: Record built commit
        shell: pwsh
        run: |
          "Built commit: $(git rev-parse HEAD)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: orbmc-windows
          path: target/x86_64-pc-windows-msvc/release/orbmc.exe
          if-no-files-found: error
