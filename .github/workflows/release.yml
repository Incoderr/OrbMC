name: Release

# Pushing a tag `vX.Y.Z` builds the launcher and its installer, signs them for
# in-app updates and publishes a GitHub release. Launchers from 0.3 on update
# through OrbMC-Setup.exe; orbmc.exe stays in releases for older launchers,
# which replace their executable with it. The tag must match the workspace version in
# Cargo.toml: the launcher compares that version with the latest release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Check tag matches Cargo version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1
          $version = $match.Matches[0].Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version"
          }

      - name: Check signing setup
        shell: pwsh
        env:
          PUBLIC_KEY: ${{ vars.ORBMC_UPDATE_PUBLIC_KEY }}
          SECRET_KEY: ${{ secrets.ORBMC_UPDATE_SECRET_KEY }}
        run: |
          if (-not $env:PUBLIC_KEY -or -not $env:SECRET_KEY) {
            throw "Set the ORBMC_UPDATE_PUBLIC_KEY variable and the ORBMC_UPDATE_SECRET_KEY secret"
          }

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build launcher
        env:
          ORBMC_DISCORD_APP_ID: ${{ vars.ORBMC_DISCORD_APP_ID }}
          ORBMC_UPDATE_PUBLIC_KEY: ${{ vars.ORBMC_UPDATE_PUBLIC_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: cargo build --release --package orbmc --no-default-features --target x86_64-pc-windows-msvc

      # windows-latest may come without Inno Setup.
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          } else {
            $iscc = $iscc.Source
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $iscc /Q "/DAppVersion=$version" "/DSourceExe=$PWD\target\x86_64-pc-windows-msvc\release\orbmc.exe" "/DOutputDir=$PWD\dist" installer\orbmc.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }

      - name: Install rsign
        run: cargo install rsign2 --locked

      # The secret key is created without a password (`rsign generate -W`);
      # it only ever exists as a GitHub secret and in this job's temp folder.
      - name: Sign installer and executable
        shell: pwsh
        env:
          SECRET_KEY: ${{ secrets.ORBMC_UPDATE_SECRET_KEY }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/orbmc.exe dist/orbmc.exe
          $key = Join-Path $env:RUNNER_TEMP "orbmc-update.key"
          # rsign needs the comment line too; the secret may hold the whole
          # key file or only its key line, so the file is rebuilt either way.
          $encoded = ($env:SECRET_KEY -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          Set-Content -Path $key -Value "untrusted comment: rsign encrypted secret key`n$encoded`n" -NoNewline
          try {
            foreach ($file in "dist/OrbMC-Setup.exe", "dist/orbmc.exe") {
              rsign sign -W -s $key -x "$file.minisig" -t "OrbMC $env:GITHUB_REF_NAME" $file
              if ($LASTEXITCODE -ne 0) { throw "rsign failed for $file" }
            }
          } finally {
            Remove-Item $key -Force
          }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/OrbMC-Setup.exe dist/OrbMC-Setup.exe.minisig dist/orbmc.exe dist/orbmc.exe.minisig --title "OrbMC $env:GITHUB_REF_NAME" --generate-notes
