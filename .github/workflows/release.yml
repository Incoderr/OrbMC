name: Release

# Pushing a tag `vX.Y.Z` builds the launcher for Windows (installer, portable
# zip) and Linux (.deb, .rpm, AppImage, .tar.gz), signs the Windows installer
# for in-app updates and publishes a GitHub release. Files are named
# `orbmc-<version>-<os>-<arch>[-<kind>]`; Windows launchers find their update
# by the installer's name (platform::self_update), so keep the pattern.
# The tag must match the workspace version in Cargo.toml: the launcher
# compares that version with the latest release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Check tag matches Cargo version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Check signing setup
        shell: pwsh
        env:
          PUBLIC_KEY: ${{ vars.ORBMC_UPDATE_PUBLIC_KEY }}
          SECRET_KEY: ${{ secrets.ORBMC_UPDATE_SECRET_KEY }}
        run: |
          if (-not $env:PUBLIC_KEY -or -not $env:SECRET_KEY) {
            throw "Set the ORBMC_UPDATE_PUBLIC_KEY variable and the ORBMC_UPDATE_SECRET_KEY secret"
          }

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build launcher
        env:
          ORBMC_DISCORD_APP_ID: ${{ vars.ORBMC_DISCORD_APP_ID }}
          ORBMC_UPDATE_PUBLIC_KEY: ${{ vars.ORBMC_UPDATE_PUBLIC_KEY }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: cargo build --release --locked --package orbmc --no-default-features --target x86_64-pc-windows-msvc

      # windows-latest may come without Inno Setup.
      - name: Package installer and portable zip
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            choco install innosetup --no-progress -y | Out-Null
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          } else {
            $iscc = $iscc.Source
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $base = "orbmc-$version-windows-x64"
          $exe = "$PWD\target\x86_64-pc-windows-msvc\release\orbmc.exe"
          & $iscc /Q "/DAppVersion=$version" "/DSourceExe=$exe" "/DOutputDir=$PWD\dist" "/DOutputName=$base-setup" installer\orbmc.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Compress-Archive -Path $exe -DestinationPath "dist\$base-portable.zip"
          "BASE=$base" >> $env:GITHUB_ENV

      - name: Install rsign
        run: cargo install rsign2 --locked

      # The secret key is created without a password (`rsign generate -W`);
      # it only ever exists as a GitHub secret and in this job's temp folder.
      - name: Sign installer
        shell: pwsh
        env:
          SECRET_KEY: ${{ secrets.ORBMC_UPDATE_SECRET_KEY }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP "orbmc-update.key"
          # rsign needs the comment line too; the secret may hold the whole
          # key file or only its key line, so the file is rebuilt either way.
          $encoded = ($env:SECRET_KEY -split "`r?`n" | Where-Object { $_.Trim() } | Select-Object -Last 1).Trim()
          Set-Content -Path $key -Value "untrusted comment: rsign encrypted secret key`n$encoded`n" -NoNewline
          try {
            $file = "dist/$env:BASE-setup.exe"
            rsign sign -W -s $key -x "$file.minisig" -t "OrbMC $env:GITHUB_REF_NAME" $file
            if ($LASTEXITCODE -ne 0) { throw "rsign failed for $file" }
          } finally {
            Remove-Item $key -Force
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: orbmc-windows
          path: dist/*
          if-no-files-found: error

  linux:
    needs: check
    uses: ./.github/workflows/build-linux.yml
    with:
      ref: ${{ github.ref_name }}
    secrets: inherit

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          win="orbmc-$v-windows-x64"
          lin="orbmc-$v-linux-x86_64"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Скачать / Download

          | Система / OS | Файл / File |
          |---|---|
          | Windows 10/11 x64 — установщик / installer | \`$win-setup.exe\` |
          | Windows 10/11 x64 — portable | \`$win-portable.zip\` |
          | Linux x86_64 — Debian, Ubuntu, Mint | \`$lin.deb\` |
          | Linux x86_64 — Fedora, openSUSE | \`$lin.rpm\` |
          | Linux x86_64 — любой дистрибутив / any distribution | \`$lin.AppImage\` |
          | Linux x86_64 — архив / archive | \`$lin.tar.gz\` |

          Установщик Windows ставит лаунчер без прав администратора и дальше обновляет его сам. Остальные сборки лаунчер находит и показывает, но обновлять их нужно вручную. \`.minisig\` — подпись для автообновления, скачивать её не нужно.

          The Windows installer needs no admin rights and keeps the launcher updated. Other builds show new versions but are updated by hand. \`.minisig\` is the signature for in-app updates; no need to download it.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "OrbMC $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
