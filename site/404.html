<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена · OrbMC</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000000; --text: #ffffff; --muted: #a3a3a3; --accent: #7b61f0; --accent-hover: #8a73f3; --ease: cubic-bezier(0.22, 1, 0.36, 1); color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font-family: Manrope, system-ui, sans-serif; text-align: center; -webkit-font-smoothing: antialiased; }
  img { width: 64px; height: 64px; margin: 0 auto 32px; display: block; }
  h1 { font-size: 48px; line-height: 48px; font-weight: 600; margin: 0 0 16px; text-wrap: balance; }
  p { font-size: 18px; line-height: 28px; font-weight: 500; color: var(--muted); margin: 0 0 32px; text-wrap: pretty; }
  a { display: inline-block; padding: 8px 12px; border-radius: 8px; background: var(--accent); color: #fff; text-decoration: none; font-size: 16px; line-height: 24px; font-weight: 600; transition: background-color 300ms var(--ease), transform 300ms var(--ease); }
  a:hover { background: var(--accent-hover); transform: translateY(-2px); }
  a:active { transform: scale(0.98); }
  :focus-visible { outline: 2px solid #b4a8ff; outline-offset: 2px; }
  @media (max-width: 768px) { h1 { font-size: 36px; line-height: 40px; } }
</style>
</head>
<body>
<main>
  <img src="/logo.svg" alt="OrbMC">
  <h1>Такой страницы нет</h1>
  <p>Ссылка устарела или в адресе опечатка.</p>
  <a href="/">На главную</a>
</main>
</body>
</html>
